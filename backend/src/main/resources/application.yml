spring:
  application:
    name: mutua-reservas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mutua}
    username: ${DB_USER:mutua}
    password: ${DB_PASSWORD:mutua}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

mutua:
  jwt:
    # Em produção defina JWT_SECRET (mínimo 32 caracteres).
    secret: ${JWT_SECRET:troque-este-segredo-em-producao-0123456789abcdef}
    expiracao-horas: ${JWT_EXPIRACAO_HORAS:8}
  cors:
    origens: ${CORS_ORIGENS:http://localhost:5173,http://localhost:3000}
  reserva:
    antecedencia-minima-cancelamento-horas: 2
    tolerancia-checkin-minutos: 30
    intervalo-vencimentos-ms: 60000
  admin:
    # Administrador inicial, criado só se ainda não existir nenhum ADMIN. Troque a senha em produção.
    email: ${ADMIN_EMAIL:admin@mutua-pi.com.br}
    senha: ${ADMIN_SENHA:admin123}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
