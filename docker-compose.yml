# Sobe o banco e a API do Sistema de Reservas Mútua-PI: cp .env.example .env && docker compose up --build
# O front roda à parte (cd frontend && npm run dev) e aponta para http://localhost:8080/api/v1.
#
# Senhas e segredos vêm do arquivo .env (obrigatório, fora do git): não há valores padrão aqui.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mutua
      POSTGRES_USER: mutua
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env (veja .env.example)}
    # A porta do banco não é publicada: só a API o acessa, pela rede interna do compose.
    # Para inspecionar os dados: docker compose exec db psql -U mutua mutua
    volumes:
      - mutua-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mutua -d mutua"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/mutua
      DB_USER: mutua
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env (veja .env.example)}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env (veja .env.example)}
      CORS_ORIGENS: ${CORS_ORIGENS:-http://localhost:5173,http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@mutua-pi.com.br}
      ADMIN_SENHA: ${ADMIN_SENHA:?Defina ADMIN_SENHA no arquivo .env (veja .env.example)}
    ports:
      - "8080:8080"
    # O HEALTHCHECK da imagem (backend/Dockerfile) consulta /api/v1/actuator/health.

volumes:
  mutua-dados:
