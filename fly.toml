# Configuração do deploy da API no Fly.io (app mutua-hmpsjw).
# Segredos (DB_URL, DB_USER, DB_PASSWORD, JWT_SECRET, ADMIN_EMAIL, ADMIN_SENHA, CORS_ORIGENS)
# ficam em "Secrets" no painel do Fly ou via: fly secrets set NOME=valor

app = "mutua-hmpsjw"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  SPRING_PROFILES_ACTIVE = "prod"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Suspende a máquina quando não há acesso (economiza créditos) e retoma em menos de 1s na primeira requisição.
  # Com "stop" ela desligava de vez e o Spring levava ~20s para subir, o que travava o login.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/v1/actuator/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
