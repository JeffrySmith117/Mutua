# fly.toml app configuration file generated for mutua-hmpsjw on 2026-11-26T15:21:08Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'mutua-hmpsjw'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  SPRING_PROFILES_ACTIVE = 'prod'

[http_service]
  internal_port = 8080
  force_https = true
  # Suspende a máquina quando não há acesso (economiza créditos) e retoma em menos de 1s na primeira requisição.
  # Com "stop" ela desligava de vez e o Spring levava ~20s para subir, o que travava o login.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/api/v1/actuator/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
