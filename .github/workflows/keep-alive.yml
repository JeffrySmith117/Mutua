# Mantém a API do Render (plano free) e o banco Neon acordados: pinga o health check a cada 5 minutos.
name: keep-alive
on: {schedule: [{cron: "*/5 * * * *"}], workflow_dispatch: {}}
jobs: {ping: {runs-on: ubuntu-latest, steps: [{run: "curl -fsS -m 120 --retry 3 --retry-delay 10 https://mutua-api-qrln.onrender.com/api/v1/actuator/health"}]}}
